<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiperKitap - Arama ve Asistan</title>
    <style>
        /* CSS (Tasarım) Ayarları */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 700px;
        }

        h1, h2 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .search-area, .chat-input-area {
            display: flex;
            margin-top: 20px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Sonuç ve Sohbet Alanı Ortak Stilleri */
        .result-area, .chat-box {
            min-height: 150px;
            max-height: 300px;
            border: 2px dashed #ddd;
            border-radius: 5px;
            display: flex;
            flex-direction: column;
            background-color: #fafafa;
            padding: 10px;
            overflow-y: auto;
            margin-bottom: 30px;
        }

        .result-area {
            align-items: center;
            justify-content: center;
            color: #888;
        }

        .chat-box {
            align-items: flex-start;
            justify-content: flex-start;
            color: #333;
            text-align: left;
            border-style: solid; /* Sohbet kutusunu biraz daha farklı gösterelim */
        }

        .kitap-satiri, .mesaj-satiri {
            width: 100%;
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #eee;
            box-sizing: border-box;
        }
        
        .kitap-satiri:last-child, .mesaj-satiri:last-child {
            border-bottom: none;
        }

        hr {
            border: 0;
            height: 1px;
            background: #e0e0e0;
            margin: 40px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- BÖLÜM 1: KİTAP ARAMA (XSS Korumalı) -->
        <h1>HiperKitap</h1>
        <p>Aradığınız bilgiye anında ulaşın</p>

        <div class="search-area">
            <input type="text" id="arama-kutusu" placeholder="Kitap, yazar veya konu ara...">
            <button type="button" id="arama-butonu">Ara</button>
        </div>

        <div class="result-area" id="sonuc-alani">
            <p>Arama sonuçları burada görüntülenecek...</p>
        </div>

        <hr>

        <!-- BÖLÜM 2: YAPAY ZEKA ASİSTANI (Gemini) -->
        <h2>Kitap Asistanı (Yapay Zeka)</h2>
        <p>Ne okuyacağına karar veremiyor musun? Asistana sor!</p>
        
        <div class="chat-box" id="chat-box">
            <!-- Mesajlar buraya gelecek -->
        </div>

        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Bana bir bilim kurgu kitabı öner...">
            <button type="button" id="chat-butonu">Gönder</button>
        </div>
    </div>

    <!-- GÜVENLİ JAVASCRIPT KODLARI -->
    <script>
        // --- 1. KİTAP ARAMA İŞLEMİ (Elasticsearch üzerinden, /api/search) ---
        document.getElementById('arama-butonu').addEventListener('click', aramaYap);

        document.getElementById('arama-kutusu').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                aramaYap();
            }
        });

        function aramaYap() {
            const aramaKutusu = document.getElementById('arama-kutusu');
            const sonucAlani = document.getElementById('sonuc-alani');
            const sorgu = aramaKutusu.value.trim();

            if (!sorgu) {
                sonucAlani.textContent = 'Lütfen bir arama terimi girin.';
                sonucAlani.style.color = '#888';
                return;
            }

            // Güvenli mesaj ataması
            sonucAlani.textContent = 'Aranıyor...';
            sonucAlani.style.color = '#888';

            fetch(`/api/search?q=${encodeURIComponent(sorgu)}`)
                .then(response => {
                    if (!response.ok) throw new Error('API yanıt vermedi');
                    return response.json();
                })
                .then(data => {
                    sonucAlani.textContent = ''; // Alanı temizle
                    sonucAlani.style.color = '#333';

                    // Backend tarafında hata döndüyse (örn. Elasticsearch'e ulaşılamadı)
                    if (data.hata) {
                        sonucAlani.textContent = 'Arama sırasında bir sorun oluştu, lütfen tekrar deneyin.';
                        sonucAlani.style.color = 'red';
                        return;
                    }

                    const sonuclar = data.sonuclar || [];

                    if (sonuclar.length === 0) {
                        sonucAlani.textContent = `"${sorgu}" için sonuç bulunamadı.`;
                        return;
                    }

                    // XSS KORUMALI VERİ EKLEME
                    sonuclar.forEach(kitap => {
                        const div = document.createElement('div');
                        div.className = 'kitap-satiri';

                        // <strong> etiketini güvenli yoldan oluşturuyoruz
                        const strongEtiketi = document.createElement('strong');
                        strongEtiketi.textContent = kitap.baslik || 'İsimsiz Kitap';
                        div.appendChild(strongEtiketi);

                        // Yazar bilgisini güvenli yoldan ekliyoruz
                        div.appendChild(document.createTextNode(` - ${kitap.yazar || 'Bilinmeyen Yazar'}`));

                        // Yayınevi varsa, alt satırda küçük ve soluk göster
                        if (kitap.yayinevi) {
                            const yayineviSatiri = document.createElement('div');
                            yayineviSatiri.style.fontSize = '13px';
                            yayineviSatiri.style.color = '#888';
                            yayineviSatiri.textContent = kitap.yayinevi;
                            div.appendChild(yayineviSatiri);
                        }

                        sonucAlani.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Hata:', error);
                    sonucAlani.textContent = 'Bağlantı hatası! Nginx, FastAPI ve Elasticsearch çalışıyor mu?';
                    sonucAlani.style.color = 'red';
                });
        }

        // --- 2. YAPAY ZEKA SOHBET İŞLEMİ ---
        document.getElementById('chat-butonu').addEventListener('click', async function() {
            const inputField = document.getElementById("chat-input");
            const chatBox = document.getElementById("chat-box");
            const message = inputField.value.trim();

            if (!message) return;

            // Kullanıcı mesajını güvenli ekleme
            const userMsgDiv = document.createElement("div");
            userMsgDiv.className = "mesaj-satiri";
            const userStrong = document.createElement("strong");
            userStrong.textContent = "Sen: ";
            userMsgDiv.appendChild(userStrong);
            userMsgDiv.appendChild(document.createTextNode(message));
            
            chatBox.appendChild(userMsgDiv);
            inputField.value = "";
            
            // Scroll'u en aşağı kaydır
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mesajMetni: message }) 
                });

                if (!response.ok) throw new Error('API Hatası');

                const data = await response.json();
                
                // Asistan mesajını güvenli ekleme
                const aiMsgDiv = document.createElement("div");
                aiMsgDiv.className = "mesaj-satiri";
                const aiStrong = document.createElement("strong");
                aiStrong.textContent = "Asistan: ";
                aiStrong.style.color = "#3498db"; // Asistanı renklendirelim
                
                aiMsgDiv.appendChild(aiStrong);
                aiMsgDiv.appendChild(document.createTextNode(data.cevap));
                
                chatBox.appendChild(aiMsgDiv);
                chatBox.scrollTop = chatBox.scrollHeight;

            } catch (error) {
                console.error("API Hatası:", error);
                const errorDiv = document.createElement("div");
                errorDiv.className = "mesaj-satiri";
                errorDiv.style.color = "red";
                errorDiv.textContent = "Bağlantı hatası: Mesaj gönderilemedi.";
                chatBox.appendChild(errorDiv);
            }
        });

        // Sohbet kutusunda "Enter" tuşuna basınca göndermesini sağla
        document.getElementById('chat-input').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                document.getElementById('chat-butonu').click();
            }
        });
    </script>
</body>
</html>
