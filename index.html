<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiperKitap - Arama</title>
    <style>
        /* CSS (Tasarım) Ayarları */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .search-area {
            display: flex;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Boş Sonuç Alanı */
        .result-area {
            min-height: 150px;
            border: 2px dashed #ddd;
            border-radius: 5px;
            display: flex;
            flex-direction: column; /* Sonuçların alt alta listelenmesi için eklendi */
            justify-content: center;
            align-items: center;
            color: #888;
            background-color: #fafafa;
            padding: 10px;
        }

        /* JavaScript ile eklenecek kitap satırlarının tasarımı */
        .kitap-satiri {
            width: 100%;
            text-align: left;
            padding: 10px;
            border-bottom: 1px solid #eee;
            color: #333;
        }
        .kitap-satiri:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Başlık -->
        <h1>HiperKitap</h1>
        <p>Aradığınız bilgiye anında ulaşın</p>

        <!-- Arama Kutusu ve Butonu -->
        <div class="search-area">
            <input type="text" id="arama-kutusu" placeholder="Kitap, yazar veya ISBN ara...">
            <button type="button" id="arama-butonu">Ara</button>
        </div>

        <!-- Sonuç Alanı -->
        <div class="result-area" id="sonuc-alani">
            <p>Arama sonuçları burada görüntülenecek...</p>
        </div>
    </div>

    <!-- API Bağlantısını Yapan JavaScript -->
    <script>
        document.getElementById('arama-butonu').addEventListener('click', function() {
            const sonucAlani = document.getElementById('sonuc-alani');
            
            // Butona basılınca önce yükleniyor mesajı gösterelim
            sonucAlani.innerHTML = '<p>Kitaplar getiriliyor...</p>';

            // Nginx üzerinden FastAPI'ye istek atıyoruz
            fetch('/api/books')
                .then(response => {
                    if (!response.ok) {
                        throw new Error('API yanıt vermedi');
                    }
                    return response.json();
                })
                .then(data => {
                    // İçerideki "yükleniyor" yazısını temizle
                    sonucAlani.innerHTML = '';

                    // Eğer boş liste dönerse
                    if (data.length === 0) {
                        sonucAlani.innerHTML = '<p>Kayıtlı kitap bulunamadı.</p>';
                        return;
                    }

                    // Gelen her bir kitap için HTML oluştur ve sonuca ekle
                    data.forEach(kitap => {
                        const div = document.createElement('div');
                        div.className = 'kitap-satiri';
                        
                        // FastAPI'nin döndürdüğü özellik isimlerine göre title/author veya isim/yazar kullanabilirsin
                        const kitapIsmi = kitap.title || kitap.isim || "İsimsiz Kitap";
                        const yazarIsmi = kitap.author || kitap.yazar || "Bilinmeyen Yazar";
                        
                        div.innerHTML = `<strong>${kitapIsmi}</strong> - ${yazarIsmi}`;
                        sonucAlani.appendChild(div);
                    });
                })
                .catch(error => {
                    console.error('Hata:', error);
                    sonucAlani.innerHTML = '<p style="color:red;">Bağlantı hatası! Nginx ve FastAPI çalışıyor mu?</p>';
                });
        });
    </script>
</body>
</html>
