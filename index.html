<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HiperKitap - Arama</title>
    <style>
        /* CSS (Tasarım) Ayarları */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }

        .search-area {
            display: flex;
            margin-top: 20px;
            margin-bottom: 30px;
        }

        input[type="text"] {
            flex-grow: 1;
            padding: 12px 15px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 5px 0 0 5px;
            outline: none;
        }

        input[type="text"]:focus {
            border-color: #3498db;
        }

        button {
            padding: 12px 25px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 0 5px 5px 0;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #2980b9;
        }

        /* Boş Sonuç Alanı */
        .result-area {
            min-height: 150px;
            border: 2px dashed #ddd;
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #888;
            background-color: #fafafa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Başlık -->
        <h1>HiperKitap</h1>
        <p>Aradığınız bilgiye anında ulaşın</p>

        <!-- Arama Kutusu ve Butonu -->
        <div class="search-area">
            <input type="text" placeholder="Kitap, yazar veya ISBN ara...">
            <button type="button">Ara</button>
        </div>

        <!-- Boş Sonuç Alanı -->
        <div class="result-area">
            <!-- İleride JavaScript ile sonuçlar buraya eklenecek -->
            <p>Arama sonuçları burada görüntülenecek...</p>
        </div>
    </div>

</body>
</html>
